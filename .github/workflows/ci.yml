name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js audit --demo --out demo-report.html --badge demo-badge.svg
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: |
            demo-report.html
            demo-badge.svg
