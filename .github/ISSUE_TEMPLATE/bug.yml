name: Bug report
description: Something in RepoPulse produced a wrong result or crashed.
labels: [bug]
body:
  - type: input
    id: repository
    attributes:
      label: Repository audited
      placeholder: owner/repo, or "demo"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoPulse version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the command and any error text. Never paste a GitHub token.
    validations:
      required: true
